<!DOCTYPE html>
<html>
<head>
    <title>Ejemplo HTML Sin CSS</title>
</head>
<body>
	<img src="Colibri.jpg" alt="COLIBRI" width="500" height="300"> <!--Imagen (.jpg, .png, .svg)-->
	<iframe width="425" height="350" src="https://www.google.com/maps/embed?origin=mfe&pb=!1m14!1m8!1m3!1d24637.230090345016!2d-0.382204!3d39.477148!3m2!1i1024!2i768!4f13.1!3m3!1m2!2sies+abastos!4s11271517402525668942!6i14!3m1!1ses!5m1!1ses"></iframe>
	<input type="file"> <!--Permite al usuario seleccionar archivos locales para subirlos MDN Web Docs-->

	<iframe src="manual_pseint.pdf" width="100%" height="600px"></iframe> <!--Insertar Documento (PDF/HTML) en la página-->
	<link rel="stylesheet" href="estilos.css"> <!--Incluir CSS-->
